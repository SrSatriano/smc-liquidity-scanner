[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-liquidity-scanner"
version = "1.1.0"
description = "Scanner de Smart Money Concepts: estrutura (BOS/CHoCH), FVG, order blocks e pools de liquidez"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matheus Rodrigues Satriano" }]
dependencies = ["httpx>=0.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
smcscan = "smcscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
