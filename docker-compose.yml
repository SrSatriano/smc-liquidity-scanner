services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: smc
      POSTGRES_PASSWORD: smc_dev
      POSTGRES_DB: market_data
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./dashboard/provisioning:/etc/grafana/provisioning
    depends_on:
      - timescaledb

  scanner:
    build: .
    env_file: config/example.env
    depends_on:
      - timescaledb
    ports:
      - "8080:8080"

volumes:
  timescale_data:
